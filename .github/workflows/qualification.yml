name: Qualification harness tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The drift-naming measurement extracts the pre-fix tree (74ca535)
          # with `git archive` — a shallow checkout cannot resolve it, and
          # GitHub refuses a raw-SHA fetch. Full history makes the measurement
          # reproducible in CI, not only on the owner's machine.
          fetch-depth: 0
      # The full-foreign-set sweep test reads step-finance-oss/step-ingestooor
      # (MIT) fixtures from a clone checked out NEXT to this repository — the
      # same layout as the local ~/github_repos convention.
      - name: Check out foreign fixtures (step-finance-oss/step-ingestooor)
        run: |
          # Pinned to the commit the research artifact was measured on:
          # a moved foreign HEAD must turn CI red only through re-measurement,
          # never silently.
          git clone https://github.com/step-finance-oss/step-ingestooor.git ../step-ingestooor
          git -C ../step-ingestooor checkout 001cf39
          echo "SEMEME_STEP_INGESTOOR_PATH=$PWD/../step-ingestooor" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
