[package]
name = "mdoracle"
version = "0.1.0"
edition = "2021"

[dependencies]
spl-token-metadata-interface = "=1.0.1"
borsh = "=1.8.1"
solana-sha256-hasher = "=2.3.0"
solana-nullable = { version = "=1.3.0", features = ["borsh"] }
solana-address = { version = "=2.6.1", features = ["borsh", "nullable"] }
serde_json = "=1.0.145"
spl-discriminator = "=0.5.2"

[[bin]]
name = "oracle"
path = "src/main.rs"
